id: qwen/qwen3.8-27b-fp8
name: Qwen3.8 27B FP8
provider: qwen
status: experimental

model:
  source: huggingface
  repo: Qwen/Qwen3.8-27B-FP8
  served_name: qwen3.8-27b-fp8

engines:
  sglang:
    enabled: true
    image: dgxspark/qwen3.8-27b-fp8-sglang:0.1.0
    base_image: lmsysorg/sglang:dev-qwen38-27b-dflash2
    base_image_env: SGLANG_BASE_IMAGE
    compose: sglang/compose.yaml
    port: 30000

  vllm:
    enabled: false

validation:
  endpoint: /v1/responses
  prompt: "Reply with exactly this text and nothing else: DGX Spark SGLang ready"
  max_tokens: 512
