[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inferpack"
version = "0.1.0"
description = "Hardware-targeted, ready-to-run inference packs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0.2,<7",
]

[project.scripts]
infer = "inferpack.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inferpack"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
